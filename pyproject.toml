[project]
name = "coreset-mre"
version = "0.1.0"
description = "Coreset Market Response Engine (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mre-core",
    "mre-net",
    "mre-security",
    "engine-adapter",
    "mre-reporting",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/net",
    "packages/security",
    "packages/engine_adapter",
    "packages/reporting",
]

[tool.uv.sources]
mre-core = { workspace = true }
mre-net = { workspace = true }
mre-security = { workspace = true }
engine-adapter = { workspace = true }
mre-reporting = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["engines/mirofish/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"**/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core/src:packages/net/src:packages/security/src:packages/engine_adapter/src:packages/reporting/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema.*", "pybreaker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits a real LLM, Zep or other paid service; never runs in CI by default",
    "db: needs a PostgreSQL server (DATABASE_URL or a local initdb)",
    "docker: needs a Docker daemon",
]
addopts = "-m 'not live' --strict-markers"

[tool.coverage.run]
branch = true
source = ["packages"]
