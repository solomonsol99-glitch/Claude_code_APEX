[project]
name = "mre-reporting"
version = "0.1.0"
description = "Charts, DOCX renderer, PDF client, branding (later steps)."
requires-python = ">=3.12,<3.13"
dependencies = ["mre-core", "mre-security"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mre_reporting"]

[tool.uv.sources]
mre-core = { workspace = true }
mre-net = { workspace = true }
mre-security = { workspace = true }
