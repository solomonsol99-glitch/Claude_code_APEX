[project]
name = "engine-adapter"
version = "0.1.0"
description = "SimulationEngine protocol, RunArtifacts schema, MiroFish/Baseline/Mock adapters."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "mre-net"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine_adapter"]

[tool.uv.sources]
mre-net = { workspace = true }
