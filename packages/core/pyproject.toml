[project]
name = "mre-core"
version = "0.1.0"
description = "Settings, tenancy, tenant config, DB models, RLS session, audit log, errors."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "pyyaml>=6.0", "jsonschema>=4.23", "sqlalchemy>=2.0.36", "alembic>=1.14", "psycopg[binary]>=3.2", "structlog>=24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mre_core"]
