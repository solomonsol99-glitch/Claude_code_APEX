[project]
name = "mre-net"
version = "0.1.0"
description = "The only place for outbound HTTP: timeouts, retries, circuit breakers, SSRF guard."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "tenacity>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mre_net"]
